<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mirror Selection | MCC</title>
    <style>
        :root { --primary: #00a2ff; --bg: #04080f; --card: #0c121d; }
        body { background: var(--bg); color: #d1d9e6; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { max-width: 500px; width: 90%; text-align: center; padding-top: 100px; flex: 1; }
        h1 { color: #fff; margin-bottom: 40px; font-size: 1.8rem; }
        .dl-card { background: var(--card); padding: 35px; border-radius: 25px; border: 1px solid #16253d; }
        .btn {
            display: block; padding: 22px; border-radius: 15px; text-decoration: none; font-weight: 700; margin-bottom: 18px; transition: 0.2s;
        }
        .primary-btn { background: var(--primary); color: #04080f; box-shadow: 0 10px 25px rgba(0,162,255,0.3); }
        .secondary-btn { background: #1a2a44; color: var(--primary); border: 1px solid var(--primary); }
        .btn:hover { transform: translateY(-3px); filter: brightness(1.1); }
    </style>
</head>
<body>

    <div class="container">
        <h1>Select Mirror</h1>
        <div class="dl-card">
            <a href="cc.calc.zip" class="btn primary-btn" download>Download latest build</a>
            <a href="meit-ca-1.0.cc.apk" class="btn secondary-btn" download>Download on Android</a>
        </div>
    </div>

    <script src="footer.js"></script>
</body>
</html>
